services:
  - type: web
    name: servinear-marketplace
    env: node
    plan: free
    region: oregon
    rootDir: ServiNear-Marketplace
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY
        value: "1"
      # DATA_DIR: on a paid plan, attach a persistent disk and set DATA_DIR to its mount path
      # (for example /var/data). On the free plan the disk is ephemeral and data resets on redeploy.
      - key: ADMIN_EMAIL
        sync: false                 # set in the Render dashboard
      - key: ADMIN_PASSWORD
        sync: false                 # 14+ characters; set in the Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PUBLIC_API_URL
        sync: false                 # https://your-api.onrender.com (payment gateway callbacks)
      - key: SMS_PROVIDER
        sync: false                 # twilio or bulksmsbd
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
      - key: SSLCOMMERZ_LIVE
        sync: false
      - key: EMBEDDING_BASE_URL
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false                 # e.g. https://app.example.com
      - key: COOKIE_DOMAIN
        sync: false                 # e.g. .example.com

services:
  - type: web
    name: servinear-marketplace
    env: node
    plan: free
    region: oregon
    rootDir: ServiNear-Marketplace
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"

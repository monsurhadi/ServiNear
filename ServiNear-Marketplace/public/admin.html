<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ServiNear Admin</title>
  <link rel="stylesheet" href="/admin.css?v=1">
</head>
<body>
  <div id="gate" class="gate hidden"><div class="gate-card"><h1>Admin access</h1><p id="gate-msg">Checking your session…</p><a class="btn primary" href="/">Go to ServiNear</a></div></div>
  <div class="shell hidden" id="shell">
    <aside class="side" id="side">
      <div class="brand"><span class="logo">S</span><div><strong>ServiNear</strong><small>Admin console</small></div></div>
      <nav id="nav" aria-label="Admin sections"></nav>
      <div class="side-foot"><div id="me" class="me"></div><a class="link" href="/">← Back to site</a></div>
    </aside>
    <main class="main">
      <header class="top"><h1 id="title">Overview</h1><div class="top-actions" id="top-actions"></div></header>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>
  <dialog id="dlg"><form method="dialog" class="dlg-body"><h2 id="dlg-title"></h2><div id="dlg-text"></div><menu><button class="btn" value="cancel">Cancel</button><button class="btn danger" id="dlg-ok" value="ok">Confirm</button></menu></form></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="/runtime-config.js?v=3"></script>
  <script src="/admin.js?v=1"></script>
</body>
</html>
